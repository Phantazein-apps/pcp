<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="PCP — Portable AI context, behind one URL you control.">
  <rect width="1200" height="360" fill="#000000"/>

  <!-- three overlapping rings: profile · memory · connections -->
  <g fill="none" stroke="#ff0018" stroke-width="10" opacity="0.95"><circle cx="1100" cy="196" r="86"/><circle cx="1196" cy="196" r="86"/><circle cx="1148" cy="279" r="86"/></g>

  <!-- editorial hairlines -->
  <line x1="84" y1="46" x2="1116" y2="46" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="84" y1="314" x2="1116" y2="314" stroke="#1c1c1c" stroke-width="1"/>

  <!-- kicker row -->
  <circle cx="91" cy="80" r="5" fill="#ff0018"/>
  <text x="108" y="85" fill="#a8a5a0" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="4">OPEN PROTOCOL</text>
  <circle cx="994" cy="80" r="3.5" fill="#ff0018"/>
  <text x="1006" y="85" fill="#5e5c58" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="2">v0.3 · DRAFT</text>

  <!-- red accent tick -->
  <rect x="84" y="126" width="46" height="4" fill="#ff0018"/>

  <!-- wordmark -->
  <text x="82" y="200" fill="#f4f2ee" font-family="'Archivo Black','Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="96" font-weight="900" letter-spacing="-1">PCP</text>

  <!-- descriptor (mono) -->
  <text x="84" y="232" fill="#a8a5a0" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" letter-spacing="0.5">profile · memory · connections</text>

  <!-- tagline (sans) -->
  <text x="84" y="270" fill="#cfccc4" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="400">Portable AI context, behind one URL you control.</text>

  <!-- bottom rule labels -->
  <text x="84" y="338" fill="#5e5c58" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1.5"><tspan fill="#ff0018">PCP</tspan>  —  REQUEST FOR COMMENTS</text>
  <text x="1116" y="338" fill="#5e5c58" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" text-anchor="end">APACHE 2.0 · BUILT ON MCP</text>
</svg>